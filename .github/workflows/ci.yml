name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint and static analysis
        run: pnpm lint
      - name: Typecheck source and tests
        run: pnpm typecheck
      - name: Build package
        run: pnpm build
      - name: Check foundation fixture drift
        run: pnpm fixtures:check
      - name: Unit tests
        run: pnpm test:unit
      - name: Offline package smoke
        run: pnpm test:smoke
