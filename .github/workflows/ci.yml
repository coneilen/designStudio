name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Resolve the runner temporary directory
        run: node scripts/prepare-ci-temp.mjs
      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare the pinned Windows SQLite prebuild
        if: runner.os == 'Windows'
        run: pnpm --filter @design-studio/storage prepare:native
      - name: Lint and static analysis
        run: pnpm lint
      - name: Build workspace packages in dependency order
        run: pnpm build
      - name: Typecheck source and tests
        run: pnpm typecheck
      - name: Check foundation fixture drift
        run: pnpm fixtures:check
      - name: Check application OpenAPI and browser inventory drift
        run: pnpm --filter @design-studio/application openapi:check
      - name: Check exact unit phase membership
        run: pnpm test:partition
      - name: Portable unit and SQLite composition tests
        run: pnpm test:portable
      - name: Owned hardware-native integration tests
        run: pnpm test:native
      - name: Offline package smoke
        run: pnpm test:smoke
